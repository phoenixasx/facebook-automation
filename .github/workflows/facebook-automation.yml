name: Facebook Automation Post - PHT Schedule

on:
  schedule:
    # Monday-Thursday at 8:00 PM PHT (12:00 PM UTC)
    - cron: '0 12 * * 1-4'
    # Friday at 2:00 AM+1 PHT (6:00 PM UTC previous day)
    - cron: '0 18 * * 5'
    # Saturday at 6:00 PM PHT (10:00 AM UTC)
    - cron: '0 10 * * 6'
    # Sunday at 4:00 PM PHT (8:00 AM UTC)
    - cron: '0 8 * * 0'

  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  facebook_post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and post to Facebook
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TZ: Asia/Manila
        run: |
          python main.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-logs
          path: logs/
          retention-days: 7
